<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Research Rabbit Hole | Researching to Understand</title>
<style>
:root{--purple:#643b79;--pale:#f5f0f7;--ink:#25242a;--muted:#5e5963;--line:#ddd6e1;--bg:#faf9fb;--green:#226a52}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Arial,Helvetica,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:15px max(20px,calc((100vw - 920px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}
header strong{color:var(--purple)}main{max-width:920px;margin:28px auto 70px;padding:0 20px}
h1{font-size:clamp(27px,4vw,39px);line-height:1.15;margin:0 0 10px}h2{font-size:26px;line-height:1.25;margin:0 0 15px}h3{font-size:19px;margin:0 0 8px}
p{margin:0 0 16px}small,.muted{color:var(--muted)}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:.1em;font-weight:bold;color:var(--purple);margin-bottom:10px}
.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:clamp(18px,3vw,30px);margin:18px 0;box-shadow:0 3px 12px #36203d08}
.soft{background:var(--pale);border-left:4px solid var(--purple);padding:18px 20px;border-radius:5px;margin:20px 0}
.feedback{background:#f0f6f2;border-left:4px solid var(--green);padding:19px 20px;border-radius:6px;margin:18px 0}
.feedback h3{color:var(--green)}.warn{background:#fff8e9;border-left:4px solid #ad7a19;padding:17px 20px;margin:18px 0}
.progress{height:8px;background:#e9e5ec;border-radius:10px;overflow:hidden;flex:1}.progress>div{height:100%;background:var(--purple);transition:width .2s}.progressrow{display:flex;align-items:center;gap:15px;min-width:200px}.progressrow small{white-space:nowrap}
button{font:inherit;cursor:pointer}button:focus-visible,.choice:focus-visible,textarea:focus-visible{outline:3px solid #a46abf;outline-offset:3px}
.btn{border:1px solid var(--purple);background:var(--purple);color:white;border-radius:7px;padding:12px 19px;font-weight:bold}
.btn.secondary{background:#fff;color:var(--purple)}.btn:disabled{opacity:.42;cursor:not-allowed}
.actions{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;margin:24px 0}.actions .right{margin-left:auto}
.choice{width:100%;display:flex;text-align:left;gap:14px;align-items:flex-start;padding:16px;border:2px solid var(--line);background:#fff;border-radius:9px;margin:10px 0;transition:background .12s,border .12s}
.choice:hover{border-color:#a98ab7}.choice.selected{border-color:var(--purple);background:var(--pale)}.number{border-radius:50%;background:#eee8f0;color:var(--purple);font-weight:bold;width:30px;height:30px;display:grid;place-items:center;flex-shrink:0}
.choice.selected .number{background:var(--purple);color:#fff}.choice b{display:block;line-height:1.35;margin-bottom:6px}.choice span.desc{display:block;font-size:15px;color:#55505a}
textarea{width:100%;min-height:105px;border:1px solid #a9a2ad;border-radius:7px;padding:12px;font:inherit;resize:vertical}
label.prompt{font-weight:bold;display:block;margin:18px 0 7px}.counter{font-size:14px;color:var(--muted);text-align:right}
.tag{display:inline-block;background:#ece6ef;color:var(--purple);font-size:13px;font-weight:bold;border-radius:20px;padding:4px 10px;margin-bottom:10px}
.review{padding:13px 0;border-bottom:1px solid var(--line)}.review:last-child{border-bottom:0}.review b{display:block}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}.twocol .panel{margin:0}@media(max-width:680px){.twocol{grid-template-columns:1fr}header{flex-direction:column;align-items:stretch}.progressrow{width:100%}}
.hidden{display:none!important}ul{padding-left:22px}li{margin:6px 0}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}
footer{text-align:center;color:var(--muted);font-size:13px;margin:45px 0}
@media print{header,.actions,.btn,footer{display:none!important}body{background:white}.panel{box-shadow:none}main{margin:0;max-width:none}}
</style>
</head>
<body>
<header><strong>THE RESEARCH RABBIT HOLE</strong><div class="progressrow"><small id="progresslabel">Introduction</small><div class="progress"><div id="progressbar" style="width:0%"></div></div></div></header>
<main id="app" aria-live="polite"></main>
<footer>Practice scenario: article titles and descriptions are invented for instructional use, not real citations.</footer>
<script>
'use strict';
const R1=[
['The Negative Effects of Social Media on Adolescent Mental Health','This study examines connections between adolescent social media use and reported symptoms of anxiety and depression. Researchers discuss several negative outcomes associated with frequent use.'],
['Social Media Use and Harmful Outcomes Among Teenagers','Researchers investigate several possible negative effects associated with teenagers’ use of social networking platforms. The study focuses specifically on behavioral and emotional outcomes.'],
['The Risks of Social Networking for Adolescent Well-Being','This article examines potential risks associated with adolescents’ participation on social networking platforms. Researchers identify several areas of concern related to adolescent well-being.'],
['Sleep Patterns Among American Middle and High School Students','Researchers examine the amount and quality of sleep reported by middle and high school students. The study also identifies several behaviors associated with differences in students’ sleep patterns.'],
['Changing Patterns of Adolescent Friendship and Social Interaction','This study examines how teenagers form, maintain, and experience friendships. Researchers identify changes in the ways adolescents communicate and interact with their peers.'],
['Attention and Task-Switching Among Secondary School Students','Researchers examine how frequently switching attention between tasks affects secondary students’ concentration and performance. The study considers several common sources of interruption during academic tasks.']
];
const R2=[
['Sleep Duration and Nighttime Smartphone Use Among Adolescents','Researchers compare adolescents’ nighttime smartphone habits with their reported sleep duration and quality. The study identifies patterns between nighttime phone activity and differences in sleep.'],
['Social Comparison and Body Satisfaction Among Adolescent Girls','This study examines how frequently adolescent girls compare themselves with other people and how those comparisons relate to reported body satisfaction. Researchers also examine where participants encounter images and information that encourage comparison.'],
['Notification Frequency and Sustained Attention During Academic Tasks','Researchers examine what happens when students receive digital notifications while completing reading and problem-solving tasks. The study measures differences in attention, task completion, and recall.'],
['Online Communities and Feelings of Belonging Among Teenagers','Researchers interview teenagers about their participation in online communities and friendships. Some participants report that online spaces provide connection and belonging that they have difficulty finding offline.'],
['Cyberbullying Experiences and Adolescent School Attendance','This study examines reported experiences with cyberbullying among adolescents and compares those experiences with patterns in school attendance. Researchers identify several relationships between online harassment and students’ experiences at school.'],
['Parent-Child Conflict Surrounding Smartphone Use','Researchers examine disagreements between parents and teenagers surrounding smartphone rules, frequency of use, and online activities. The study explores how these conflicts affect communication within families.']
];
const KEY='rabbit-hole-v2';let state={step:0,r1:[],r2:[],final:[],notes:{},revealed:{}};
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Number.isInteger(old.step)&&old.step>=0&&old.step<=9)state={...state,...old}}catch(e){}
const app=document.getElementById('app');
const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
function next(){state.step++;save();render();window.scrollTo(0,0)}
function back(){state.step=Math.max(0,state.step-1);save();render();window.scrollTo(0,0)}
function go(step){state.step=step;save();render();window.scrollTo(0,0)}
function setNote(id,value){state.notes[id]=value;save();updateButtons()}
function toggle(key,index){let a=state[key];if(a.includes(index))state[key]=a.filter(x=>x!==index);else if(a.length<3)state[key]=[...a,index];save();render();document.getElementById('choices')?.scrollIntoView({block:'nearest'})}
function choices(items,key){return `<p class="muted">Select exactly three articles. <strong>${state[key].length} of 3 selected.</strong> There is no hidden “correct three.”</p><div id="choices">${items.map((x,i)=>`<button type="button" class="choice ${state[key].includes(i)?'selected':''}" aria-pressed="${state[key].includes(i)}" onclick="toggle('${key}',${i})"><span class="number">${i+1}</span><span><b>“${escapeHTML(x[0])}”</b><span class="desc">${escapeHTML(x[1])}</span></span></button>`).join('')}</div>`}
function question(id,title,hint=''){return `<label class="prompt" for="${id}">${title}</label>${hint?`<p class="muted">${hint}</p>`:''}<textarea id="${id}" oninput="setNote('${id}',this.value)" placeholder="Write your thinking here...">${escapeHTML(state.notes[id]||'')}</textarea>`}
function panel(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}
function feedback(title,body){return `<section class="feedback"><h3>${title}</h3>${body}</section>`}
function nav(nextText='Continue',condition=true,backVisible=true){return `<div class="actions">${backVisible?'<button class="btn secondary" onclick="back()">← Back</button>':'<span></span>'}<button class="btn right" id="nextbutton" ${condition?'':'disabled'} onclick="next()">${nextText} →</button></div>`}
function reveal(id){state.revealed[id]=true;save();render();window.scrollTo(0,0)}
function gated(id,label,body,feedbackBody,ready){return panel(label,body+(state.revealed[id]?feedback('Pause and reconsider',feedbackBody):`<div class="actions"><button class="btn" ${ready?'':'disabled'} onclick="reveal('${id}')">Read the coaching feedback →</button></div>`))+(state.revealed[id]?nav():''))}
function titles(items,ids){return ids.map(i=>`<li>“${escapeHTML(items[i][0])}”</li>`).join('')}
function updateButtons(){let s=state.step;let ready= s===1?state.r1.length===3:s===2?(state.notes.why1||'').trim().length>=15:s===4?state.r2.length===3:s===5?(state.notes.why2||'').trim().length>=15:s===7?(state.notes.underneath||'').trim().length>=15:s===8?state.final.length===3&&(state.notes.finalWhy||'').trim().length>=15:true;const btn=document.getElementById('nextbutton');if(btn)btn.disabled=!ready;const coach=document.querySelector('button[onclick^="reveal"]');if(coach)coach.disabled=!ready}
function render(){
const s=state.step;document.getElementById('progresslabel').textContent=['Introduction','Round 1: Select','Round 1: Explain','Research coaching','Round 2: Select','Round 2: Explain','Follow the complexity','Ask better questions','Revisit your choices','Think aloud'][s];document.getElementById('progressbar').style.width=(s/9*100)+'%';
let out='';
if(s===0)out=`<div class="eyebrow">An interactive research investigation · about 20–30 minutes</div><h1>The Research Rabbit Hole</h1><p class="muted">What happens when you research to understand instead of researching to prove yourself right?</p>${panel('You are the researcher',`<p>Imagine that you strongly believe: <strong>“Social media is harmful for teenagers.”</strong> You have access to an academic database, but you can only read three articles at a time.</p><p>You'll choose sources, explain your thinking, encounter guidance, and get a chance to change your mind. The goal is <strong>not</strong> to guess which articles your instructor wants you to pick.</p><div class="soft"><strong>Your job:</strong> Notice how your decisions change when you stop asking “Which article proves my point?” and start asking “What do I need to understand?”</div><p>You'll see feedback <strong>during</strong> the investigation. At the end, you'll receive prompts for a short <strong>think-aloud recording</strong>, not a written report.</p><p><small>All article titles and descriptions in this simulation are fictional. They are practice search results, not sources to cite.</small></p>`)}${nav('Begin the investigation',true,false)}`;
if(s===1)out=`<div class="eyebrow">Round 1 · First instincts</div><h1>What would you read first?</h1><p>You're researching the belief: <strong>“Social media is harmful for teenagers.”</strong> The database returns six results. You only have time to read three.</p>${panel('Choose three articles',choices(R1,'r1'))}${nav('Lock in my first choices',state.r1.length===3)}`;
if(s===2)out=`<div class="eyebrow">Round 1 · Explain your choices</div><h1>Why those three?</h1>${panel('Your initial selections',`<ol>${titles(R1,state.r1)}</ol><hr class="divider">${question('why1','What made these articles seem worth reading?','Think about the titles, the descriptions, and what you hoped the articles would tell you.')}`)}${nav('See what a researcher should notice',(state.notes.why1||'').trim().length>=15)}`;
if(s===3)out=`<div class="eyebrow">Research coaching · Look underneath the claim</div><h1>What did the search results actually offer?</h1>${panel('Two kinds of entry points',`<p><strong>Articles 1–3</strong> speak directly about negative effects, risks, or harmful outcomes. They look relevant to the original belief immediately.</p><p><strong>Articles 4–6</strong> explore sleep, friendships, and attention. They do not announce a verdict on social media. Yet each could help a researcher understand an underlying issue.</p><div class="soft"><strong>Important distinction:</strong> This does not mean articles 1–3 are bad, or that you were wrong to select them. It means <em>agreement with your belief</em> and <em>usefulness for understanding the topic</em> are not the same test.</div><p>For example, a study about sleep might help us ask whether the issue is social media itself, nighttime use, reduced sleep, or something else. A study of friendships could reveal benefits, harms, or both.</p>`)}${feedback('A question to carry forward',`<p>When you see a research result, ask: <strong>“What could this article help me understand?”</strong> not just “Does its title sound like my opinion?”</p><p>And remember: a title or abstract suggests what a study investigates. It does not tell us everything the researchers found. We would have to <strong>read the article</strong> before drawing conclusions.</p>`)}${nav('Try a more complicated search')}`;
if(s===4)out=`<div class="eyebrow">Round 2 · A more complicated search</div><h1>Same belief. More revealing results.</h1><p>You search again. This time, the articles focus on specific experiences and possible mechanisms. You still have time to read only three.</p>${panel('Choose three new articles',choices(R2,'r2'))}${nav('Lock in my second choices',state.r2.length===3)}`;
if(s===5)out=`<div class="eyebrow">Round 2 · Explain your choices</div><h1>What looks useful now?</h1>${panel('Your second selections',`<ol>${titles(R2,state.r2)}</ol><hr class="divider">${question('why2','Why would you read these three first?','Has anything changed in how you decide which articles are worth your time? It is okay if you are not sure yet.')}`)}${nav('Explore what the results complicate',(state.notes.why2||'').trim().length>=15)}`;
if(s===6)out=`<div class="eyebrow">Research coaching · Resist the simple verdict</div><h1>There is more than one question here.</h1>${panel('Follow the underlying issues',`<div class="review"><b>Sleep and phone use</b>Is the issue the platform, the time of day, interruptions to sleep, or a combination?</div><div class="review"><b>Social comparison and body satisfaction</b>Which experiences or kinds of content might matter, and for whom?</div><div class="review"><b>Notifications and attention</b>Could interruptions during schoolwork be an important piece of the puzzle?</div><div class="review"><b>Online belonging</b>Could some teenagers experience meaningful benefits from online communities, even if other experiences carry risks?</div><div class="review"><b>Cyberbullying and school attendance</b>How might an online experience affect a teenager's offline life?</div><div class="review"><b>Family conflict over phone use</b>Could disagreements about technology be part of the experience we're trying to understand?</div>`)}${feedback('What changed?',`<p>None of these article descriptions gives us a complete answer. They offer <strong>paths of investigation</strong>.</p><p>The question “Is social media harmful?” bundles together different behaviors, experiences, people, and outcomes. Research can help us untangle those pieces. Some findings might support our initial belief, some might challenge it, and some might make it more precise.</p><p><strong>Nuance is not indecision.</strong> It is what happens when we ask a better question.</p>`)}${nav('Look underneath the belief')}`;
if(s===7)out=`<div class="eyebrow">Your turn · Ask before you argue</div><h1>What is underneath the gut feeling?</h1>${gated('q','Move from a claim to an investigation',`<p>Return to the belief: <strong>“Social media is harmful for teenagers.”</strong></p><p>Imagine someone says this with complete confidence. Instead of arguing with them or agreeing immediately, ask what experiences or concerns might be underneath that belief.</p>${question('underneath','Name at least three things you would need to understand to investigate this belief responsibly.','Try questions about causes, circumstances, different experiences, or effects. You do not need to answer them.')}`,`<p>Compare your questions with these possible directions:</p><ul><li>What kinds of online activities are teenagers doing?</li><li>Do the experiences differ depending on the teenager or the platform?</li><li>What role do sleep, bullying, social comparison, or social connection play?</li><li>How could researchers distinguish an association from a cause?</li></ul><p>You do not need to match this list. The key is that <strong>questions open the investigation</strong>; a predetermined answer closes it.</p>`,(state.notes.underneath||'').trim().length>=15)}`;
if(s===8)out=`<div class="eyebrow">Final investigation · Reconsider your choices</div><h1>Would you research differently now?</h1><div class="twocol"><section class="panel"><h3>Your Round 1 choices</h3><ol>${titles(R1,state.r1)}</ol></section><section class="panel"><h3>Your Round 2 choices</h3><ol>${titles(R2,state.r2)}</ol></section></div>${panel('Choose your final research priorities',`<p>Imagine you can now select <strong>any three articles from the second search</strong> to guide your next reading. Keep your original selections if they still make sense, or change them. What matters is the reason.</p>${choices(R2,'final')}${question('finalWhy','For each of your final three choices, explain what that article could help you understand.','You can refer to the article numbers. A useful explanation names a question or issue, not simply whether the article agrees with you.')}`)}${nav('Finish the investigation',state.final.length===3&&(state.notes.finalWhy||'').trim().length>=15)}`;
if(s===9)out=`<div class="eyebrow">Investigation complete · Think aloud</div><h1>What happened to your thinking?</h1>${feedback('The big idea',`<p><strong>Research is not about finding sources that say what you already think.</strong></p><p>Research begins by asking: <em>Why do I think that? What might be happening underneath that gut feeling?</em></p><p>A source does not become a bad source because it complicates your opinion. If it helps you understand something important about your topic, it may be doing exactly the job you need.</p>`)}${panel('Your decisions, side by side',`<div class="review"><b>Round 1: Your first three</b><ol>${titles(R1,state.r1)}</ol></div><div class="review"><b>Round 2: Your next three</b><ol>${titles(R2,state.r2)}</ol></div><div class="review"><b>Final research priorities</b><ol>${titles(R2,state.final)}</ol></div><p><strong>What you originally said:</strong> ${escapeHTML(state.notes.why1||'')}</p><p><strong>What you said at the end:</strong> ${escapeHTML(state.notes.finalWhy||'')}</p>`)}${panel('Your assignment: A 3–5-minute think-aloud recording',`<p>Record yourself <strong>explaining your thinking</strong> about this investigation. You may keep this page open while recording and refer to your choices. Speak naturally; do not read a prepared essay.</p><ol><li><strong>First instincts:</strong> What drew you to your first three sources? What did you expect research to do?</li><li><strong>A moment of reconsideration:</strong> What idea, source, or piece of feedback made you pause or rethink something?</li><li><strong>Researching to understand:</strong> How did your final priorities compare with your initial selections? Explain your reasoning, even if you kept some choices.</li><li><strong>Transfer:</strong> When you return to your own Unit 1 essay, what will you do differently as you decide what needs researching?</li></ol><div class="soft"><strong>For Canvas:</strong> Submit your recording in the separate Think-Aloud assignment using your instructor's submission directions. <strong>You do not need to submit a written report from this website.</strong></div><p><small>You'll be assessed on the explanation of your thinking, not on choosing a secret set of “correct” articles or speaking perfectly.</small></p><button class="btn secondary" onclick="window.print()">Print or save these prompts</button>`)}<div class="actions"><button class="btn secondary" onclick="go(8)">← Review my choices</button><button class="btn secondary" onclick="restart()">Start over</button></div>`;
app.innerHTML=out;updateButtons()
}
function restart(){if(confirm('Start over? This will erase your choices and written responses on this device.')){state={step:0,r1:[],r2:[],final:[],notes:{},revealed:{}};save();render();window.scrollTo(0,0)}}
render();
</script>
</body></html>
