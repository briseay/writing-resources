<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Research Rabbit Hole | Researching to Understand</title>
<style>
:root{--purple:#633b78;--pale:#f4eff7;--ink:#28252c;--muted:#615b66;--line:#dcd5e1;--green:#23634e}
*{box-sizing:border-box}body{margin:0;background:#faf9fb;color:var(--ink);font:17px/1.55 Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px max(20px,calc((100vw - 960px)/2));display:flex;gap:22px;align-items:center;justify-content:space-between}
header strong{color:var(--purple)}.progress{height:8px;width:190px;background:#e8e3eb;border-radius:8px;overflow:hidden}.progress div{height:100%;background:var(--purple);transition:width .2s}
main{max-width:920px;margin:30px auto 70px;padding:0 20px}h1{font-size:clamp(28px,4vw,40px);line-height:1.15;margin:0 0 15px}h2{font-size:24px;margin:0 0 14px}h3{font-size:19px;margin:0 0 10px}p{margin:0 0 16px}.muted,small{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:.08em;color:var(--purple);font-size:13px;font-weight:bold;margin-bottom:10px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3vw,28px);margin:20px 0;box-shadow:0 3px 12px #34203a08}
.soft{background:var(--pale);border-left:4px solid var(--purple);padding:17px 20px;border-radius:5px;margin:18px 0}.feedback{background:#eff6f1;border-left:4px solid var(--green);padding:18px 20px;border-radius:6px;margin:18px 0}.feedback h3{color:var(--green)}
button{font:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #9d70b1;outline-offset:2px}.btn{border:1px solid var(--purple);background:var(--purple);color:#fff;border-radius:7px;padding:12px 18px;font-weight:bold}.btn.secondary{background:#fff;color:var(--purple)}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:25px 0}
.choice{display:flex;align-items:flex-start;text-align:left;width:100%;gap:13px;border:2px solid var(--line);background:#fff;border-radius:9px;padding:15px;margin:10px 0}.choice:hover{border-color:#a88db7}.choice.selected{border-color:var(--purple);background:var(--pale)}.choice b{display:block;line-height:1.35}.choice .desc{display:block;color:#58515d;font-size:15px;margin-top:5px}.num{background:#eee7f0;color:var(--purple);border-radius:50%;width:30px;height:30px;flex-shrink:0;display:grid;place-items:center;font-weight:bold}.selected .num{background:var(--purple);color:white}
textarea{width:100%;min-height:100px;padding:12px;border:1px solid #a79cab;border-radius:6px;font:inherit;resize:vertical}.prompt{font-weight:bold;display:block;margin:16px 0 7px}.step{border-bottom:1px solid var(--line);padding:12px 0}.step:last-child{border-bottom:0}.step b{display:block}.tag{display:inline-block;background:#ede6f0;color:var(--purple);padding:4px 10px;border-radius:18px;font-size:13px;font-weight:bold;margin-bottom:10px}ol,ul{padding-left:23px}li{margin:7px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}.cols .panel{margin:0}footer{text-align:center;font-size:13px;color:var(--muted);padding:20px}.printonly{display:none}
@media(max-width:650px){header{display:block}.progress{margin-top:10px;width:100%}.cols{grid-template-columns:1fr}}
@media print{header,footer,.actions,.noprint{display:none!important}.printonly{display:block}body{background:white;font-size:12px}main{max-width:none;margin:0;padding:0}.panel{box-shadow:none;break-inside:avoid;padding:12px;margin:12px 0}h1{font-size:24px}h2{font-size:17px}h3{font-size:14px}.feedback{break-inside:avoid} }
</style>
</head>
<body>
<header><strong>THE RESEARCH RABBIT HOLE</strong><div><small id="stepname">Introduction</small><div class="progress"><div id="bar" style="width:0%"></div></div></div></header>
<main id="app"></main>
<footer>All sample article titles and descriptions are fictional and are not sources to cite.</footer>
<script>
'use strict';
const FIRST=[
['The Negative Effects of Social Media on Adolescent Mental Health','Examines relationships between adolescent social media use and reported anxiety and depression.'],
['Social Media Use and Harmful Outcomes Among Teenagers','Investigates possible negative behavioral and emotional outcomes associated with social networking.'],
['The Risks of Social Networking for Adolescent Well-Being','Examines possible risks to adolescent well-being associated with social networking platforms.'],
['Sleep Patterns Among American Middle and High School Students','Examines sleep duration, quality, and behaviors associated with differences in student sleep.'],
['Changing Patterns of Adolescent Friendship and Social Interaction','Investigates how teenagers form, maintain, and experience friendships and peer communication.'],
['Attention and Task-Switching Among Secondary School Students','Examines interruptions, attention switching, and performance during academic tasks.']
];
const SECOND=[
['Sleep Duration and Nighttime Smartphone Use Among Adolescents','Compares nighttime smartphone habits with adolescent sleep duration and quality.'],
['Social Comparison and Body Satisfaction Among Adolescent Girls','Investigates comparison with others, media experiences, and reported body satisfaction.'],
['Notification Frequency and Sustained Attention During Academic Tasks','Examines digital notifications, reading, problem solving, attention, and recall.'],
['Online Communities and Feelings of Belonging Among Teenagers','Explores teenagers’ experiences of friendship and belonging in online communities.'],
['Cyberbullying Experiences and Adolescent School Attendance','Investigates relationships between online harassment experiences and school attendance.'],
['Parent-Child Conflict Surrounding Smartphone Use','Explores disagreements about smartphone rules and family communication.']
];
const PATHS=[
{title:'Cyberbullying',intro:'Social media can expose teenagers to cyberbullying.',steps:[
{q:'What part of cyberbullying would you investigate first?',opts:[['What counts as bullying?','Before measuring cyberbullying, researchers need a definition. An unkind remark, a repeated pattern, and a power imbalance are not necessarily the same thing.'],['How teenagers experience it','That raises questions about frequency, severity, relationships, and context. Different experiences might produce different outcomes.'],['How often it occurs','Frequency matters, but counting incidents requires deciding what qualifies as cyberbullying.']]},
{q:'Why might cyberbullying matter for teenagers?',opts:[['It may affect emotional well-being','You have named a possible effect. What would researchers measure, and how would they separate bullying from other influences?'],['It may change peer relationships','You have identified a social effect. What kinds of relationships or changes would count as evidence?'],['It may affect school participation','You have identified a school-related outcome. Researchers would need to examine the relationship rather than assume the cause.']]},
{q:'What connection still needs investigation?',opts:[['Whether social media increases exposure','Good question: the existence of bullying does not by itself establish how social media changes its likelihood.'],['Whether online and offline bullying differ','This could help explain whether the medium changes the experience, rather than simply assuming that it does.'],['Which teenagers are affected, and how','This keeps us from treating all teenagers and experiences as identical.']]}]},
{title:'Sleep',intro:'Social media might interfere with teenagers’ sleep.',steps:[
{q:'What would you need to understand first?',opts:[['How much sleep teenagers need','That establishes a baseline before claiming that a behavior disrupts healthy sleep.'],['When and how teenagers use their phones','This distinguishes bedtime habits from daytime use and different activities.'],['Other reasons teenagers lose sleep','This matters because social media may be one factor among school schedules, work, stress, and more.']]},
{q:'Why might disrupted sleep matter?',opts:[['Effects on attention and learning','You have identified an outcome that researchers could investigate rather than assume.'],['Effects on mood and well-being','This opens a question about what changes with sleep and how those changes are measured.'],['Effects on physical health','This directs you toward specific health outcomes instead of a broad claim that sleep is important.']]},
{q:'What connection needs to be tested?',opts:[['Whether nighttime use reduces sleep','That asks about a possible relationship, not merely whether phone use and sleep occur together.'],['Whether poor sleepers use phones more','Excellent alternative direction: the relationship might run the other way or both ways.'],['Whether the kind of phone activity matters','This tests whether all digital activity should be treated alike.']]}]},
{title:'Social comparison',intro:'Social media might encourage harmful comparisons.',steps:[
{q:'What would you investigate first?',opts:[['What social comparison means','Defining the concept helps distinguish everyday comparison from specific patterns researchers can examine.'],['Which content encourages comparison','This examines circumstances instead of assuming every online experience has the same effect.'],['Who experiences comparison most strongly','This explores differences among teenagers rather than treating them as one group.']]},
{q:'Why might comparison matter?',opts:[['It may affect body satisfaction','That is a specific possible outcome. Researchers would need evidence about the relationship.'],['It may affect confidence','What does confidence mean here, and how could researchers measure it?'],['It may also motivate some teenagers','A valuable complication: a mechanism might have different outcomes depending on context.']]},
{q:'What relationship needs investigation?',opts:[['Whether comparison changes self-perception','That asks about an effect rather than simply assuming comparison is harmful.'],['Whether prior insecurity influences comparison','This considers whether the direction of influence might be reversed.'],['Whether different platforms shape experiences','This avoids treating all social media environments as identical.']]}]},
{title:'Attention',intro:'Social media might interfere with concentration.',steps:[
{q:'What would you investigate first?',opts:[['What concentration involves','A clear definition helps researchers distinguish attention from motivation or memory.'],['How notifications interrupt tasks','This identifies a possible mechanism to investigate.'],['Whether students multitask while studying','This focuses on a behavior rather than blaming a platform in general.']]},
{q:'Why might interrupted attention matter?',opts:[['It may affect comprehension','Researchers could examine whether interruptions influence understanding, not just speed.'],['It may affect task completion','You have named a measurable outcome, but the cause still needs investigation.'],['It may affect memory','This suggests a specific outcome and invites questions about how memory is tested.']]},
{q:'What connection still needs investigation?',opts:[['Whether notifications cause measurable changes','This distinguishes a possible cause from a general observation.'],['Whether students can adapt to interruptions','This challenges the assumption that the effect must be identical for everyone.'],['Whether other interruptions have similar effects','This tests whether the problem is social media specifically or interruptions more broadly.']]}]}
];
const KEY='research-rabbit-hole-v3';
let state={page:0,first:[],second:[],notes:{},paths:[],pathIndex:0,answerIndex:0,answers:[[],[]]};
try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved&&Number.isInteger(saved.page))state={...state,...saved}}catch(e){}
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function render(){const p=state.page;document.getElementById('stepname').textContent=['Introduction','First search','First impressions','First feedback','Why Ladder','Second search','Second impressions','Source coaching','Final reflection & submission'][p];document.getElementById('bar').style.width=(p/8*100)+'%';let html='';
if(p===0)html=`<div class="eyebrow">An interactive research investigation</div><h1>The Research Rabbit Hole</h1>${box('What are we actually researching?',`<p>Imagine you believe: <strong>“Social media is harmful to teenagers.”</strong> Your job is to investigate that belief, not just find someone who agrees with you.</p><p>You'll make research decisions, unpack the reasons underneath your belief, receive feedback as you go, and then choose sources again.</p><div class="soft"><strong>No trick answers.</strong> Every Why Ladder choice is a reasonable direction for an argument. Your feedback will explain what your choice means you still need to investigate.</div><p>At the end, you'll <strong>print or save your final investigation page as a PDF</strong> and return to Canvas to submit it with a <strong>3–5-minute think-aloud video</strong>.</p><small>All sample articles are fictional teaching examples, not actual published studies.</small>`)}${nav('Begin',true,false)}`;
if(p===1)html=`<div class="eyebrow">Round 1 · First instincts</div><h1>Which articles would you read first?</h1><p>You believe social media is harmful to teenagers. You have time to read only <strong>three</strong> of these six results.</p>${box('Your first search',choices(FIRST,'first'))}${nav('Continue',state.first.length===3)}`;
if(p===2)html=`<div class="eyebrow">Round 1 · Think about your decision</div><h1>Why these sources?</h1>${box('Your first three articles',`<ol>${list(FIRST,state.first)}</ol>${question('firstWhy','What made these articles seem useful to you?','What did you expect them to help you establish?')}`)}${nav('Get feedback',filled('firstWhy'))}`;
if(p===3)html=`<div class="eyebrow">Coaching · Before you search again</div><h1>Are you investigating, or confirming?</h1>${box('Look at the two kinds of results',`<p>Articles 1–3 announce harmful effects or risks. Articles 4–6 investigate sleep, friendship, and attention without announcing whether social media is good or bad.</p><p><strong>Neither group is automatically better.</strong> But a title that agrees with your opinion is not necessarily the article that will help you understand <em>why</em> something happens.</p>`)}${feed('What research actually needs',`<p>Suppose you say, “Social media is harmful because of cyberbullying.” You have offered a <strong>reason</strong>, but several questions remain: What counts as bullying? What makes it harmful? How does social media contribute to it?</p><p>Those questions point to the research you need. Let's practice following the reasoning underneath a claim before you select more articles.</p>`)}${nav('Unpack the why')}`;
if(p===4){let pi=state.pathIndex,ai=state.answerIndex;let chosen=state.paths[pi];let current=chosen==null?null:PATHS[chosen];let ans=current?state.answers[pi][ai]:undefined;
html=`<div class="eyebrow">The Why Ladder · Path ${pi+1} of 2</div><h1>Don't stop at your first “because.”</h1><p><strong>Claim:</strong> Social media is harmful to teenagers.</p>`;
if(chosen==null){html+=box('Choose a reason to investigate',`<p>All four are reasonable possible reasons. Choose one to follow. You will investigate a different reason in your second ladder.</p>${PATHS.map((x,i)=>state.paths.includes(i)?'':buttonOption(x.title,'pickPath('+i+')')).join('')}`)}
else {let step=current.steps[ai];html+=box(current.title,`<p>${esc(current.intro)}</p><div class="soft"><strong>Question ${ai+1} of 3:</strong> ${esc(step.q)}</div>${step.opts.map((o,i)=>buttonOption(o[0],'pickAnswer('+i+')',ans===i)).join('')}${ans===undefined?'':feed('Follow that reasoning',`<p>${esc(step.opts[ans][1])}</p><p><strong>Notice:</strong> This answer gives you a direction, not a finished argument. You still need to investigate the connection with academic evidence.</p>`)}${ans===undefined?'':`<div class="actions"><span></span><button class="btn" onclick="advanceLadder()">${ai===2?(pi===0?'Try a second reason':'Finish the ladders'):'Ask the next why'} →</button></div>`}`)}
html+=`<div class="actions"><button class="btn secondary" onclick="previous()">← Back to previous section</button></div>`;
}
if(p===5)html=`<div class="eyebrow">Round 2 · Now investigate</div><h1>Choose sources with a purpose.</h1>${box('What your Why Ladders uncovered',ladderSummary()+`<p>You have explored two possible reasons beneath the original claim. Now consider which sources could help you <strong>test or complicate that reasoning</strong>.</p>`)}${box('A new set of six results',choices(SECOND,'second'))}${nav('Continue',state.second.length===3)}`;
if(p===6)html=`<div class="eyebrow">Round 2 · Explain your choices</div><h1>What would you investigate now?</h1>${box('Your new selections',`<ol>${list(SECOND,state.second)}</ol>${question('secondWhy','What could these three articles help you understand?','Think about the reasoning you unpacked in your Why Ladders, not whether the titles prove social media is bad.')}`)}${nav('See the source coaching',filled('secondWhy'))}`;
if(p===7)html=`<div class="eyebrow">Coaching · Research the reasoning</div><h1>What can each source help investigate?</h1>${box('Six possible paths, not six verdicts',SECOND.map((x,i)=>`<div class="step"><b>${i+1}. ${esc(x[0])}</b>${esc(['Could help investigate whether nighttime phone use relates to sleep and whether the direction of that relationship is clear.','Could help examine what social comparison involves, when it occurs, and how it relates to body satisfaction.','Could help test whether notifications and interruptions affect attention during schoolwork.','Could complicate a blanket harm claim by examining how online spaces can also support belonging.','Could help investigate how cyberbullying relates to students’ school experiences and which connections need further study.','Could help examine whether phone-related conflict affects family relationships and how that conflict develops.'][i])}</div>`).join(''))}${feed('The key distinction',`<p>Research is not finding an article that simply says <strong>“social media is bad.”</strong> It is finding evidence that helps you determine whether the <strong>reasoning underneath that belief holds up</strong>.</p><p>Research may support your reasoning, complicate it, or show that part of it needs to change. And a title or abstract is only a starting point: you must read the study before claiming to know what it establishes.</p>`)}${nav('Review and prepare submission')}`;
if(p===8)html=finalPage();
app.innerHTML=html;window.scrollTo(0,0)}
function box(title,body){return `<section class="panel"><h2>${title}</h2>${body}</section>`}
function feed(title,body){return `<div class="feedback"><h3>${title}</h3>${body}</div>`}
function nav(label,enabled=true,showBack=true){return `<div class="actions">${showBack?'<button class="btn secondary" onclick="previous()">← Back</button>':'<span></span>'}<button class="btn" ${enabled?'':'disabled'} onclick="next()">${label} →</button></div>`}
function list(arr,ids){return ids.map(i=>`<li>${esc(arr[i][0])}</li>`).join('')}
function choices(arr,key){return `<p class="muted">Select three articles. <strong>${state[key].length} of 3 selected.</strong></p>${arr.map((a,i)=>`<button class="choice ${state[key].includes(i)?'selected':''}" aria-pressed="${state[key].includes(i)}" onclick="toggle('${key}',${i})"><span class="num">${i+1}</span><span><b>${esc(a[0])}</b><span class="desc">${esc(a[1])}</span></span></button>`).join('')}`}
function buttonOption(label,handler,selected=false){return `<button class="choice ${selected?'selected':''}" onclick="${handler}"><span class="num">${selected?'✓':'›'}</span><span><b>${esc(label)}</b></span></button>`}
function question(key,label,hint){return `<label class="prompt" for="${key}">${label}</label><p class="muted">${hint}</p><textarea id="${key}" oninput="setNote('${key}',this.value)" placeholder="Explain your thinking in your own words...">${esc(state.notes[key]||'')}</textarea>`}
function filled(key){return (state.notes[key]||'').trim().length>=15}
function setNote(key,value){state.notes[key]=value;save();let b=document.querySelector('.actions button:last-child');if(b&&b.hasAttribute('disabled')&&filled(key))b.disabled=false}
function toggle(key,i){let a=state[key];state[key]=a.includes(i)?a.filter(x=>x!==i):(a.length<3?[...a,i]:a);save();render()}
function next(){state.page=Math.min(8,state.page+1);save();render()}
function previous(){if(state.page===4){state.page=3}else state.page=Math.max(0,state.page-1);save();render()}
function pickPath(i){state.paths[state.pathIndex]=i;state.answerIndex=0;save();render()}
function pickAnswer(i){state.answers[state.pathIndex][state.answerIndex]=i;save();render()}
function advanceLadder(){if(state.answerIndex<2){state.answerIndex++}else if(state.pathIndex===0){state.pathIndex=1;state.answerIndex=0}else{state.page=5}save();render()}
function ladderSummary(){return state.paths.map((id,pi)=>{let path=PATHS[id];return `<div class="step"><b>Ladder ${pi+1}: ${esc(path.title)}</b><ol>${path.steps.map((st,si)=>`<li><strong>${esc(st.q)}</strong> ${esc(st.opts[state.answers[pi][si]][0])}</li>`).join('')}</ol></div>`}).join('')}
function finalPage(){return `<div class="eyebrow noprint">Investigation complete</div><h1>Your Research Rabbit Hole Investigation</h1><p><strong>Starting belief:</strong> Social media is harmful to teenagers.</p>${box('Round 1: What I selected and why',`<ol>${list(FIRST,state.first)}</ol><p><strong>My reasoning:</strong> ${esc(state.notes.firstWhy)}</p>`)}${box('My two Why Ladders',ladderSummary())}${box('Round 2: What I selected and why',`<ol>${list(SECOND,state.second)}</ol><p><strong>My reasoning:</strong> ${esc(state.notes.secondWhy)}</p>`)}${box('Your 3–5-minute think-aloud video',`<p>Use your printed investigation to explain your thinking naturally. Do not read a prepared essay. Address these questions:</p><ol><li>Why did you choose your first three articles? What were you looking for?</li><li>Walk through one of your Why Ladders. Where did asking another “why?” reveal something you would need to research?</li><li>How did the ladders influence your second round of source selection? What changed, or what stayed the same, and why?</li><li>How will you use this approach when you return to your own Unit 1 essay?</li></ol>`)}${feed('Submit BOTH items in Canvas',`<ol><li><strong>Your investigation printout:</strong> Use the button below to print this page or choose <strong>Save as PDF</strong> in your browser's print dialog.</li><li><strong>Your think-aloud video:</strong> Record your 3–5-minute explanation and submit it according to your Canvas assignment instructions.</li></ol><p><strong>Return to Canvas and submit both the printout/PDF and the video.</strong> This activity does not submit anything automatically.</p>`)}<div class="actions noprint"><button class="btn secondary" onclick="state.page=7;save();render()">← Review source feedback</button><button class="btn" onclick="window.print()">Print / Save as PDF</button></div><div class="printonly"><p><strong>Submission reminder:</strong> Return to Canvas and submit this printout/PDF and your 3–5-minute think-aloud video.</p></div>`}
save();render();
</script>
</body>
</html>
